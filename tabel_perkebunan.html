<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table luas perkebunan</title>
</head>
<body>
    <h3>Table luas perkebunan</h3>

    <table border="1">
        <!-- Baris pertama -->
         <tr>
            <th bgcolor="blue">jenis perkebunan</th>
            <th colspan="4">luas tanah</th>
         </tr>

         <!-- Baris kedua -->
          <tr>
            <td bgcolor="brown">kopi</td>
            <td>21 hektar</td>
            <td>36 hektar</td>
            <td>45 hektar</td>
            <td>54 hektar</td>
          </tr>

          <!-- Baris ketiga -->
           <tr>
            <td bgcolor="red">Kelapa sawit</td>
            <td>30 hektar</td>
            <td>27 hektar</td>
            <td>31 hektar</td>
            <td>20 hektar</td>
           </tr>

           <!-- Baris keempat-->
            <tr>
                <td bgcolor="green">Total produksi</td>
                <td colspan="2">Besaran panen Bulanan</td>
                <td colspan="2">Besaran panen Tahunan</td>
            </tr>

            <!-- Baris kelima-->
             <tr>
                <td bgcolor="yellow">Kelapa sawit</td>
                <td colspan="2" style="text-align: center;">200 ton</td>
                <td colspan="2" style="text-align: center;">450 ton</td>
             </tr>
    </table>
</body>
</html>
